name: ocudu
title: OCUDU
base: core26
version: '26.04'
summary: OCUDU is a 5G software radio suite developed by the Linux Foundation.
description: |
  OCUDU is a free and open-source 5G software radio suite.

  It implements an integrated gNodeB (both CU and DU functions) that can be
  used with real radios or with a simulated radio over ZeroMQ. The srsRAN 4G
  project contains a simulated UE that can be used with this gNodeB for
  testing. For more information, see https://docs.ocudu.org/.

website: https://docs.ocudu.org/
source-code: https://github.com/ghislainbourgeois/ocudu-snap
contact: https://github.com/ghislainbourgeois/ocudu-snap/issues
issues: https://github.com/ghislainbourgeois/ocudu-snap/issues
icon: snap/local/ocudu.png
license: BSD-3-Clause-Open-MPI
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:

apps:
  gnb:
    command: bin/gnb-wrapper
    plugs:
      - kernel-module-observe
      - process-control
      - network
      - network-bind
      - network-control
      - system-observe
      - raw-usb

parts:
  ocudu:
    plugin: cmake
    source: https://gitlab.com/ocudu/ocudu.git
    source-type: git
    source-tag: release_26_04
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DENABLE_ZEROMQ=On
    build-packages:
      - binutils-dev
      - libboost-all-dev
      - libdwarf-dev
      - libdw-dev
      - libelf-dev
      - libfftw3-dev
      - libgtest-dev
      - libmbedtls-dev
      - libsctp-dev
      - libuhd-dev
      - libyaml-cpp-dev
      - libzmq3-dev
      - pkg-config
      - python3-requests
    stage-packages:
      #- libasan8
      #- libatomic1
      - libdw1t64
      - libfftw3-single3
      - libmbedcrypto16
      - libsctp1
      - libsodium23
      - libuhd4.9.0
      - libyaml-cpp0.8
      - libzmq5
      - python3-requests
      - uhd-host
    override-prime: |
      craftctl default
      ${CRAFT_PRIME}/usr/bin/uhd_images_downloader -i ${CRAFT_PRIME}/usr/local/share/uhd/images
      mkdir -p ${CRAFT_PRIME}/bin
      cat > ${CRAFT_PRIME}/bin/gnb-wrapper << 'EOF'
      #!/bin/sh
      # UHD first probes image names relative to the current directory. Use a
      # directory readable under strict confinement before starting it.
      cd "$SNAP"
      export UHD_IMAGES_DIR="$SNAP/usr/local/share/uhd/images"
      exec "$SNAP/usr/local/bin/gnb" "$@"
      EOF
      chmod +x ${CRAFT_PRIME}/bin/gnb-wrapper
